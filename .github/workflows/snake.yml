### 👨‍💻 About Me

I'm a **student based in Nagpur, India**, passionate about turning ideas into working technology. My core interests lie in **Data Analytics, Web Development, and Deep Learning** — with a growing focus on how AI tools can accelerate real-world engineering.

I actively participate in **hackathons**, where I combine hands-on development with **team leadership and project management** to ship solutions under pressure. I enjoy the full journey — from analyzing a problem, to designing a solution, to shipping something that actually works.

```yaml
Current Focus:
